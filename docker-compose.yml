services:
  fetch:
    image: alpine/git:latest
    entrypoint: ["sh", "-c", "rm -rf /repo/* /repo/.[!.]* 2>/dev/null; git clone --depth 1 https://github.com/notificacionesautocentroltda-cell/web-autocentro.git /repo"]
    volumes:
      - repo:/repo
  web:
    image: caddy:2-alpine
    depends_on:
      fetch:
        condition: service_completed_successfully
    command: ["caddy", "run", "--config", "/repo/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - repo:/repo:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  repo:
  caddy_data:
  caddy_config:
